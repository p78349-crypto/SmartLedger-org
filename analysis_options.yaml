# 강화된 분석 옵션 - 프로덕션 준비
include: package:flutter_lints/flutter.yaml

# NOTE: This repo keeps snapshot code under backups/ for manual reference.
# Exclude it from static analysis so flutter analyze stays actionable.

analyzer:
  errors:
    # 경고를 에러로 취급
    unused_element: error
    unused_field: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    deprecated_member_use: error
    use_build_context_synchronously: error
    unnecessary_library_name: ignore
    use_string_in_part_of_directives: ignore
    library_private_types_in_public_api: ignore
    # Extensions on State subclasses can safely use setState
    invalid_use_of_protected_member: ignore
    
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - 'build/**'
    - 'backups/**'
    - '_sealed/**'
    - '_wms_backup_*/**'
    # 🔒 AI 규제 준수: AI 관련 파일들 빌드에서 제외
    - 'lib/services/gemini_*.dart'
    - 'lib/services/*ai*.dart'
    - 'lib/widgets/*voice*.dart'
    - 'lib/screens/*voice*.dart'
    - 'lib/screens/*gemini*.dart'
    - 'lib/services/custom_gemma*.dart'
    - "lib/config/ai_compliance_engine.dart"
    - "lib/config/ai_security_seal.dart"
    - "lib/config/regional_ai_policy.dart"
    - "lib/services/root_memo_service_v2.dart"
    - "lib/screens/ai_investment_advisor_screen_utils.dart"
    - "lib/screens/ai_model_selector_screen.dart"
    - "lib/screens/asset_simple_input_screen_ui.dart"
    - "lib/screens/ceo_monthly_defense_report_screen.dart"
    - "lib/screens/ceo_prediction_dashboard_screen_utils.dart"
    - "lib/screens/cloud_backup_settings_screen.dart"
    - "lib/screens/incremental_backup_screen.dart"
    - "lib/screens/quick_stock_use_screen.dart"
    - "lib/screens/root_memo_list_screen.dart"
    - "lib/screens/visit_price_form_screen.dart"
    - "lib/screens/wms_optimized_pda_screen.dart"
    - "lib/screens/wms_pda_quick_input_screen.dart"
    - "lib/services/backup_service_incremental.dart"
    - "lib/services/ceo_prediction_service.dart"
    - "lib/services/ceo_prediction_service_extensions.dart"
    - "lib/services/cloud_backup_service.dart"
    - "lib/services/cloud_backup_service_utils.dart"
    - "lib/services/financial_analytics_service.dart"
    - "lib/services/financial_analytics_service_extensions.dart"
    - "lib/services/financial_analytics_service_utils.dart"
    - "lib/services/incremental_backup_service.dart"
    - "lib/services/incremental_backup_service_extensions.dart"
    - "lib/utils/ai_investment_helper.dart"
    - "lib/utils/ceo_prediction_helper.dart"
    - "lib/utils/cloud_backup_helper.dart"
    - "lib/utils/financial_analytics_helper.dart"
    - "lib/utils/incremental_backup_helper.dart"
    - "lib/utils/root_memo_migration_util.dart"
    - "lib/utils/wms_data_gateway.dart"
    - "lib/utils/wms_optimization_settings.dart"
    - "lib/utils/wms_optimized_barcode_service.dart"
    - "lib/utils/wms_smart_cache.dart"
    - "lib/utils/wms_unified_gateway.dart"
    - "lib/widgets/ai_model_status_widget.dart"
    - "lib/widgets/ai_status_indicator.dart"
    - "lib/widgets/food_expiry_upsert_dialog.dart"
    - "lib/widgets/root_memo_widget.dart"
    - "lib/widgets/root_memo_widget_v2.dart"
    - 'SmartLedger_backup_*/**'

linter:
  rules:
    # 필수 규칙
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_returning_null_for_future
    - avoid_slow_async_io
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - control_flow_in_finally
    - empty_statements
    - hash_and_equals
    - invariant_booleans
    - iterable_contains_unrelated_type
    - list_remove_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_duplicate_case_values
    - prefer_void_to_null
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_statements
    - unrelated_type_equality_checks
    - valid_regexps
    
    # 스타일 규칙
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - use_key_in_widget_constructors
    
    # 가독성 규칙
    - unnecessary_brace_in_string_interps
    - unnecessary_getters_setters
    - unnecessary_lambdas
    - unnecessary_new
    - unnecessary_null_aware_assignments
    - unnecessary_null_checks
    - unnecessary_null_in_if_null_operators
    - unnecessary_overrides
    - unnecessary_parenthesis
    - unnecessary_string_escapes
    - unnecessary_string_interpolations
    - unnecessary_this
    - avoid_unused_constructor_parameters
    - avoid_redundant_argument_values
